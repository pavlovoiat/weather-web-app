<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <title>Weather</title>
</head>

<body>
    <div>
        <div>
            <input id="searchBar" type="text" placeholder="City...">
            <button id="button">Check</button>
        </div>
        <div id="suggestions"></div>
        <div>
            <h3 id="city">City</h3>
            <img id="icon">
            <h1 id="temperature">--°C</h1>
            <h3 id="description">Description</h3>
        </div>
        <hr>
        <div>
            <div>
                <p id="humidity">--%</p>
                <p>Humidity</p>
            </div>
            <hr>
            <div>
                <p id="feelsLike">--°C</p>
                <p>Feels like</p>
            </div>
            <hr>
            <div id="windSpeed">
                <p>--km/h</p>
                <p>Wind</p>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>

</html>
